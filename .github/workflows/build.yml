name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '4.10.3'
      - run: gradle build
      - uses: actions/upload-artifact@v3
        with:
          name: adultmod-jar
          path: build/libs/*.jar
